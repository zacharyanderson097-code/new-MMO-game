name: Gameplay rules and realm service
on: [push, pull_request]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test_rules.sh
      - run: python3 -m json.tool Emberfall.uproject > /dev/null
      - run: python3 -m unittest discover -s backend -p 'test_*.py' -v
